<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} • BookShelf</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="/" class="logo">
            📚 BookShelf
        </a>

    </div>

</header>


<main class="container error-page">

    <div class="error-card">

        <div class="error-number">
            {{ status_code }}
        </div>

        <h1>
            {{ title }}
        </h1>

        <p>
            {{ message }}
        </p>

        <a
            href="/"
            class="button"
        >
            Return Home
        </a>

    </div>

</main>


<footer>

    <div class="container">

        <p>
            BookShelf • FastAPI Library Project
        </p>

    </div>

</footer>

</body>

</html>
