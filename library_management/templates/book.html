<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} • BookShelf</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="/" class="logo">
            📚 BookShelf
        </a>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/docs">
                API Docs
            </a>

        </nav>

    </div>

</header>


<main class="container">

    <div class="breadcrumb">

        <a href="/">
            ← Back to books
        </a>

    </div>


    <article class="single-book">

        <div class="large-book-icon">
            📖
        </div>

        <div class="single-book-content">

            <p class="eyebrow">
                BOOK #{{ book.id }}
            </p>

            <h1>
                {{ book.title }}
            </h1>

            <div class="author-box">

                <img
                    src="{{ book.reader.profile_path }}"
                    alt="{{ book.reader.name }}"
                    class="profile-image"
                >

                <div>

                    <span class="small-label">
                        BORROWED BY
                    </span>

                    <a
                        href="/readers/{{ book.reader.id }}/books"
                        class="reader-name"
                    >
                        {{ book.reader.name }}
                    </a>

                </div>

            </div>


            <div class="description-box">

                <h2>
                    About this book
                </h2>

                <p>
                    {{ book.description }}
                </p>

            </div>


            <div class="date-box">

                <span>
                    Borrowed:
                </span>

                <strong>
                    {{ book.borrowed_at.strftime("%d %B %Y, %H:%M UTC") }}
                </strong>

            </div>

        </div>

    </article>

</main>


<footer>

    <div class="container">

        <p>
            BookShelf • FastAPI Library Project
        </p>

    </div>

</footer>

</body>

</html>
